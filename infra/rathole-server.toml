# Meridian rathole server (VPS side).
#
# Control channel: 0.0.0.0:2333  (hub-rust clients connect here)
# Data services bind on 127.0.0.1 (loopback) — nginx reverse-proxies them via
# /dev/<port>/... on 443, so they never need to be exposed to the internet.
#
# Slot -> ports (must match hub-rust src/core/slots.rs):
#   WDA    : 18100 + slot
#   Bridge : 19001 + slot
#   Stream : 19100 + slot

[server]
bind_addr = "0.0.0.0:2333"

[server.transport]
type = "tcp"

[server.transport.tcp]
nodelay = true
keepalive_secs = 10
keepalive_interval = 3

[server.services.wda-0]
type = "tcp"
token = "meridian-wda-0"
bind_addr = "127.0.0.1:18100"

[server.services.bridge-0]
type = "tcp"
token = "meridian-bridge-0"
bind_addr = "127.0.0.1:19001"

[server.services.stream-0]
type = "tcp"
token = "meridian-stream-0"
bind_addr = "127.0.0.1:19100"

