map $http_access_control_request_private_network $private_network_preflight {
    default 0;
    "true" 1;
}

server {
    server_name www.meridianhub.cc meridianhub.cc;

    location / {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Allow-Private-Network true always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Zero-leak device port proxy: routes /dev/{port}/* over Tailscale to the Windows/Linux host
    location ~ ^/dev/(\d+)/(.*) {
        proxy_pass http://100.101.105.127:$1/$2$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    ssl_certificate /etc/letsencrypt/live/meridianhub.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meridianhub.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.meridianhub.cc) {
        return 301 https://$host$request_uri;
    }
    if ($host = meridianhub.cc) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name www.meridianhub.cc meridianhub.cc;
    return 404;
}
