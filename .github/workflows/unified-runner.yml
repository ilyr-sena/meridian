name: unified-runner
on:
  workflow_dispatch:
  push:
    paths:
      - "runner/**"
      - ".github/workflows/unified-runner.yml"

jobs:
  build:
    # Xcode 27 image: the capture probe uses SCContentSharingPicker, which is
    # iOS 27.0+ only. Xcode 16's SDK (macos-15) has no ScreenCaptureKit for
    # iOS at all, so the probe compiles into a silent no-op stub and the
    # screen-recording picker never appears.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Clone WebDriverAgent
        run: git clone --depth 1 https://github.com/appium/WebDriverAgent.git

      - name: Integrate Probe streaming engine into WebDriverAgentRunner
        run: python3 runner/tools/merge_probe_wda.py --wda WebDriverAgent --probe runner/ProbeApp

      - name: Build Unified Runner (unsigned)
        working-directory: WebDriverAgent
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=27.0 \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Fix nested bundle identifiers
        working-directory: WebDriverAgent
        run: |
          APP=$(find build/Build/Products/Debug-iphoneos -maxdepth 1 -name '*Runner.app' | head -1)
          # Xcode's UI-test runner layout gives the host app id "<base>.xctrunner"
          # and the embedded .xctest the shorter prefix "<base>". isideload (the
          # pure-Rust signer) requires app extensions to be NESTED under the host
          # id ("<host>.<suffix>"). Rewrite the .xctest bundle id so it nests:
          #   host  = dev.ius.meridian.runner.xctrunner
          #   xctest= dev.ius.meridian.runner.xctrunner.xctest
          XCTEST="$APP/PlugIns/WebDriverAgentRunner.xctest"
          plutil -replace CFBundleIdentifier -string "dev.ius.meridian.runner.xctrunner.xctest" "$XCTEST/Info.plist"
          echo "xctest bundle id -> $(plutil -extract CFBundleIdentifier raw "$XCTEST/Info.plist")"

      - name: Ad-hoc sign app and nested bundles
        working-directory: WebDriverAgent
        run: |
          APP=$(find build/Build/Products/Debug-iphoneos -maxdepth 1 -name '*Runner.app' | head -1)
          echo "Found app: $APP"
          # Sign nested bundles deepest-first
          find "$APP" -type d \( -name '*.xctest' -o -name '*.framework' \) | sort -r | while read -r b; do
            codesign --force --sign - "$b" && echo "signed bundle: $b"
          done
          find "$APP" -type f -perm +111 -name '*.dylib' | while read -r d; do
            codesign --force --sign - "$d" && echo "signed dylib: $d"
          done
          codesign --force --sign - "$APP"
          echo "signed host app: $APP"

      - name: Package MeridianRunner IPA
        working-directory: WebDriverAgent
        run: |
          APP=$(find build/Build/Products/Debug-iphoneos -maxdepth 1 -name '*Runner.app' | head -1)
          echo "Packaging $APP with Meridian branding..."
          plutil -replace CFBundleDisplayName -string "Meridian" "$APP/Info.plist"
          plutil -replace CFBundleName -string "Meridian" "$APP/Info.plist"
          # The merge patches the source Runner Info.plist, but the final
          # -Runner.app plist is regenerated by the build; apply the capture
          # permissions + background modes here so they actually ship.
          python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys
          p = sys.argv[1]
          with open(p, "rb") as f:
              d = plistlib.load(f)
          d["CFBundleDisplayName"] = "Meridian"
          d["CFBundleName"] = "Meridian"
          d["UIBackgroundModes"] = ["continuous", "audio", "screen-capture"]
          d["NSScreenCaptureUsageDescription"] = "Screen capture for low-latency device display streaming."
          d["NSLocalNetworkUsageDescription"] = "Local network streaming and automation server."
          with open(p, "wb") as f:
              plistlib.dump(d, f)
          print("Info.plist patched: capture permissions + background modes")
          PY
          if [ -f "WebDriverAgentRunner/Assets.xcassets/AppIcon.appiconset/icon-1024.png" ]; then
            cp "WebDriverAgentRunner/Assets.xcassets/AppIcon.appiconset/icon-1024.png" "$APP/AppIcon60x60@2x.png" || true
            cp "WebDriverAgentRunner/Assets.xcassets/AppIcon.appiconset/icon-1024.png" "$APP/AppIcon76x76@2x~ipad.png" || true
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry MeridianRunner-unsigned.ipa Payload

      - name: Upload MeridianRunner IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeridianRunner-unsigned-ipa
          path: WebDriverAgent/MeridianRunner-unsigned.ipa
